
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #app {
    min-height: 500px;
    width: 100%;
    font-family: 'Lato', sans-serif;
    overflow: hidden;
  }

  .page {
    display: none;
    min-height: 500px;
    width: 100%;
    position: relative;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 40px 24px;
  }

  .page.active {
    display: flex;
  }

  /* Page 1 */
  #p1 {
    background: linear-gradient(160deg, #fff0f3 0%, #ffe4ec 40%, #ffd6e7 100%);
  }

  .petals {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .petal {
    position: absolute;
    font-size: 18px;
    opacity: 0.5;
    animation: fall linear infinite;
  }

  @keyframes fall {
    0% { transform: translateY(-30px) rotate(0deg); opacity: 0.6; }
    100% { transform: translateY(560px) rotate(360deg); opacity: 0; }
  }

  .sorry-text {
    font-family: 'Playfair Display', serif;
    font-size: 72px;
    font-weight: 600;
    color: #c2185b;
    letter-spacing: -1px;
    line-height: 1;
    position: relative;
    z-index: 2;
    text-shadow: 0 2px 24px rgba(194,24,91,0.12);
  }

  .sorry-sub {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 18px;
    color: #e91e8c;
    margin: 14px 0 32px;
    opacity: 0.85;
    z-index: 2;
  }

  .heart-big {
    font-size: 52px;
    animation: heartbeat 1.4s ease-in-out infinite;
    z-index: 2;
    margin-bottom: 20px;
  }

  @keyframes heartbeat {
    0%,100% { transform: scale(1); }
    14% { transform: scale(1.18); }
    28% { transform: scale(1); }
    42% { transform: scale(1.12); }
    56% { transform: scale(1); }
  }

  .ok-btn {
    background: linear-gradient(135deg, #e91e8c, #c2185b);
    color: white;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 16px;
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    letter-spacing: 1px;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 8px 28px rgba(194,24,91,0.28);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .ok-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 12px 36px rgba(194,24,91,0.38); }
  .ok-btn:active { transform: scale(0.97); }

  .small-hearts {
    position: absolute;
    bottom: 20px;
    font-size: 13px;
    opacity: 0.35;
    z-index: 1;
    letter-spacing: 8px;
  }

  /* Page 2 */
  #p2 {
    background: linear-gradient(160deg, #fce4ec 0%, #f8bbd0 50%, #f48fb1 100%);
  }

  .question-card {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    padding: 36px 32px 28px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 8px 40px rgba(194,24,91,0.1);
    z-index: 2;
  }

  .question-emoji {
    font-size: 44px;
    margin-bottom: 12px;
    animation: swing 2s ease-in-out infinite;
  }

  @keyframes swing {
    0%,100% { transform: rotate(-6deg); }
    50% { transform: rotate(6deg); }
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #880e4f;
    line-height: 1.4;
    margin-bottom: 8px;
  }

  .question-sub {
    font-size: 13px;
    color: #ad1457;
    opacity: 0.7;
    margin-bottom: 28px;
  }

  .answer-row {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
  }

  .yes-btn, .no-btn {
    border: none;
    border-radius: 50px;
    padding: 13px 36px;
    font-size: 15px;
    font-family: 'Lato', sans-serif;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-weight: 400;
  }

  .yes-btn {
    background: linear-gradient(135deg, #e91e8c, #c2185b);
    color: white;
    box-shadow: 0 6px 20px rgba(194,24,91,0.28);
    position: relative;
  }
  .yes-btn:hover { transform: translateY(-2px) scale(1.05); }

  .no-btn {
    background: white;
    color: #ad1457;
    border: 1.5px solid #f48fb1;
    box-shadow: 0 2px 10px rgba(194,24,91,0.08);
    transition: all 0.3s cubic-bezier(.34,1.56,.64,1);
  }
  .no-btn:hover { background: #fff0f5; }

  /* Page 3 */
  #p3 {
    background: linear-gradient(160deg, #fce4ec 0%, #ffcdd2 50%, #fce4ec 100%);
  }

  .love-title {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    font-weight: 600;
    color: #b71c1c;
    line-height: 1.2;
    z-index: 2;
    text-shadow: 0 2px 20px rgba(183,28,28,0.1);
  }

  .love-name {
    color: #e91e8c;
  }

  .love-hearts {
    font-size: 40px;
    z-index: 2;
    margin: 18px 0;
    animation: lovepulse 1.8s ease-in-out infinite;
  }

  @keyframes lovepulse {
    0%,100% { transform: scale(1); letter-spacing: 8px; }
    50% { transform: scale(1.12); letter-spacing: 14px; }
  }

  .love-msg {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: #c2185b;
    opacity: 0.85;
    z-index: 2;
    max-width: 320px;
    line-height: 1.6;
  }

  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    animation: confettiFall linear infinite;
    pointer-events: none;
  }

  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(560px) rotate(720deg); opacity: 0; }
  }

  .floating-hearts {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    width: 100%;
    height: 100%;
    top: 0; left: 0;
  }
  .fh {
    position: absolute;
    font-size: 22px;
    animation: floatUp linear infinite;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { transform: translateY(100%) scale(0.6); opacity: 0; }
    20% { opacity: 0.7; }
    100% { transform: translateY(-60px) scale(1); opacity: 0; }
  }
</style>

<div id="app">

  <!-- Page 1: Sorry -->
  <div class="page active" id="p1">
    <div class="petals" id="petals"></div>
    <div class="heart-big">🌹</div>
    <div class="sorry-text">I'm Sorry</div>
    <div class="sorry-sub">from the bottom of my heart</div>
    <button class="ok-btn" onclick="goTo('p2')">It's okay &nbsp;💌</button>
    <div class="small-hearts">♡ &nbsp; ♡ &nbsp; ♡ &nbsp; ♡ &nbsp; ♡</div>
  </div>

  <!-- Page 2: Question -->
  <div class="page" id="p2">
    <div class="floating-hearts" id="fhearts"></div>
    <div class="question-card">
      <div class="question-emoji">🥺</div>
      <div class="question-text">Are you still angry at me?</div>
      <div class="question-sub">please be honest with me ♡</div>
      <div class="answer-row">
        <button class="yes-btn" id="yesBtn" onclick="yesClick()">No, I'm not 💕</button>
        <button class="no-btn" id="noBtn" onmouseenter="runAway(this)" onclick="runAway(this)">Still angry 😤</button>
      </div>
    </div>
  </div>

  <!-- Page 3: Love -->
  <div class="page" id="p3">
    <div id="confettiBox" style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;"></div>
    <div class="love-hearts">❤️ ❤️ ❤️</div>
    <div class="love-title">I love you<br><span class="love-name">Ankita</span> 🌸</div>
    <div class="love-hearts" style="font-size:32px;margin:10px 0;">❤️ ❤️ ❤️</div>
    <div class="love-msg">"You are my favorite person in the whole world. Always and forever."</div>
  </div>

</div>

<script>
  function goTo(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'p3') startConfetti();
  }

  function yesClick() {
    goTo('p3');
  }

  let noCount = 0;
  let yesBtnSize = 16;

  function runAway(btn) {
    noCount++;
    yesBtnSize = Math.min(24, 15 + noCount * 1.5);
    const yesBtn = document.getElementById('yesBtn');
    yesBtn.style.fontSize = yesBtnSize + 'px';
    yesBtn.style.padding = (12 + noCount * 2) + 'px ' + (32 + noCount * 4) + 'px';

    const row = document.querySelector('.answer-row');
    const rw = row.offsetWidth;
    const bw = btn.offsetWidth;
    const maxX = rw - bw - 10;
    const maxY = 40;
    const rx = Math.floor(Math.random() * maxX);
    const ry = Math.floor(Math.random() * maxY) - maxY / 2;
    btn.style.position = 'absolute';
    btn.style.left = rx + 'px';
    btn.style.top = ry + 'px';
    btn.style.transition = 'all 0.3s cubic-bezier(.34,1.56,.64,1)';
  }

  // Petals on page 1
  (function() {
    const box = document.getElementById('petals');
    const icons = ['🌸','🌷','🌺','💮','🏵️','✿'];
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('div');
      s.className = 'petal';
      s.textContent = icons[Math.floor(Math.random()*icons.length)];
      s.style.left = Math.random()*100 + '%';
      s.style.animationDuration = (4 + Math.random()*5) + 's';
      s.style.animationDelay = (Math.random()*6) + 's';
      s.style.fontSize = (12 + Math.random()*14) + 'px';
      box.appendChild(s);
    }
  })();

  // Floating hearts on page 2
  (function() {
    const box = document.getElementById('fhearts');
    const h = ['❤️','💕','💗','💖','💝'];
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'fh';
      el.textContent = h[Math.floor(Math.random()*h.length)];
      el.style.left = Math.random()*90 + '%';
      el.style.bottom = '0';
      el.style.animationDuration = (4 + Math.random()*5) + 's';
      el.style.animationDelay = (Math.random()*7) + 's';
      el.style.fontSize = (14 + Math.random()*18) + 'px';
      box.appendChild(el);
    }
  })();

  function startConfetti() {
    const box = document.getElementById('confettiBox');
    const colors = ['#e91e8c','#f48fb1','#c2185b','#ff80ab','#f06292','#ff4081','#fce4ec'];
    for (let i = 0; i < 36; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      c.style.left = Math.random()*100 + '%';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (3 + Math.random()*4) + 's';
      c.style.animationDelay = (Math.random()*3) + 's';
      c.style.width = (6 + Math.random()*8) + 'px';
      c.style.height = (6 + Math.random()*8) + 'px';
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      box.appendChild(c);
    }
  }
</script>
